<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Thanks!</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>:root{color-scheme:light dark;--bg:#f4ead5;--card:#fffaf0;--ink:#2b1d14;--edge:#2b1d14;--shadow:#e2c89a;--dot:#ead8b4;--accent:#2f7d79;--orange:#d9570b}
@media (prefers-color-scheme:dark){:root{--bg:#1d1712;--card:#28201a;--ink:#f5e9d6;--edge:#0d0906;--shadow:#0d0906;--dot:#2a211a;--accent:#5cc0b5;--orange:#ff8a5b}}
body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:20px 20px;color:var(--ink);display:grid;place-items:center;min-height:100vh}
main{max-width:480px;margin:24px;padding:28px;text-align:center;background:var(--card);border:2px solid var(--edge);border-radius:14px;box-shadow:4px 4px 0 var(--shadow)}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:40px;margin:0 0 8px;color:var(--orange)}a{color:var(--accent);font-weight:700}</style></head>
<body><main><h1>Thanks!</h1><p>The link has been sent. A tailored CV and cover letter will be prepared for it.</p><p><a href="/">Send another job</a></p></main></body></html>
